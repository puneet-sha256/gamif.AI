<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Gamif.AI · Your goals</title>
<link rel="stylesheet" href="theme.css">
<script src="app.js" defer></script>
<style>
  .goals-card {
    width: 100%;
    max-width: 640px;
  }
  .pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px;
    padding: 0 12px;
    border-radius: var(--r-pill);
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .pill:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .pill--on {
    background: var(--accent-soft);
    color: var(--accent-text);
    border-color: transparent;
  }
  .char-count {
    font-size: 12px;
    color: var(--text-muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .char-count strong { color: var(--text-secondary); font-weight: 600; }
</style>
</head>
<body class="page page--centered" style="position: relative; overflow: hidden;">

<div class="dot-grid"></div>
<span class="glow-orb glow-orb--violet" style="width: 380px; height: 380px; top: -120px; left: -120px;"></span>
<span class="glow-orb glow-orb--cyan"   style="width: 320px; height: 320px; bottom: -120px; right: -60px; animation-delay: 4s;"></span>
<span class="glow-orb glow-orb--amber"  style="width: 220px; height: 220px; top: 40%; right: -60px; animation-delay: 7s;"></span>
<div class="floaters">
  <span class="floater floater--circle floater--slow" style="top:8%; right:8%; width:54px; height:54px;"></span>
  <span class="floater floater--diamond floater--delay-2" style="bottom:14%; left:8%;"></span>
  <span class="floater floater--dot floater--delay-3" style="top:48%; left:6%;"></span>
  <span class="floater floater--ring floater--slow floater--delay-4" style="bottom:22%; right:8%;"></span>
</div>

<div class="auth goals-card" style="position: relative; z-index: 1;">
  <div class="steps">
    <span class="steps__dot steps__dot--active" style="width:6px;background:var(--success)"></span>
    <span class="steps__dot steps__dot--active"></span>
    <span class="steps__label">Step 2 of 2 · What you're aiming for</span>
  </div>

  <div class="auth__head">
    <h1>
      What do you want to become?
      <svg class="sparkle sparkle--violet sparkle--lg sparkle--delay" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: -2px; margin-left: 4px;">
        <path d="M12 2 L13.5 9 L21 10 L13.5 11.5 L12 18.5 L10.5 11.5 L3 10 L10.5 9 Z"/>
      </svg>
    </h1>
    <p>Be specific. The clearer the goal, the better we can plan your tasks.</p>
  </div>

  <form class="auth__form" onsubmit="event.preventDefault()">
    <div class="field">
      <label class="field__label">Pick one or more focus areas</label>
      <div class="pill-group">
        <button type="button" class="pill pill--on">
          <svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M3 8h6M3 16h6M15 8h6M15 16h6"/></svg>
          Fitness
        </button>
        <button type="button" class="pill pill--on">
          <svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14M4 19l4-2 4 2 4-2 4 2"/></svg>
          Learning
        </button>
        <button type="button" class="pill">
          <svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM3 21a9 9 0 0 1 18 0"/></svg>
          Career
        </button>
        <button type="button" class="pill">
          <svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.65-7 10-7 10z"/></svg>
          Relationships
        </button>
        <button type="button" class="pill">
          <svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Discipline
        </button>
        <button type="button" class="pill">
          <svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="M3 12l4 4L21 4"/></svg>
          Side project
        </button>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="g">Describe your long-term goals</label>
      <textarea class="textarea" id="g" rows="9" placeholder="Example:
• Run a half-marathon in under 2 hours by November.
• Get fluent enough in Spanish to hold a 30-min conversation.
• Ship the v1 of my side project — landing page, payments, first 10 paid users.
• Read one non-fiction book per month.">• Run a half-marathon in under 2 hours by November.
• Get fluent enough in Spanish to hold a 30-min conversation.
• Ship the v1 of my side project — landing page, payments, first 10 paid users.</textarea>
      <div class="char-count"><strong>187</strong>/2000 · minimum 50 characters</div>
    </div>

    <div class="row row--between mt-2">
      <a href="03-profile-setup.html" class="btn btn--ghost">
        <svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M15 6l-6 6 6 6"/></svg>
        Back
      </a>
      <button type="submit" class="btn btn--accent">
        Generate my plan
        <svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"/></svg>
      </button>
    </div>
  </form>
</div>

</body>
</html>
