<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Picker Test</title>
    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #3b82f6;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1e293b;
        }
        .emoji-input-wrapper {
            display: flex;
            gap: 10px;
            position: relative;
        }
        input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            font-size: 1.1rem;
        }
        button {
            padding: 14px 20px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            min-width: 60px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.45);
        }
        .current-emoji {
            font-size: 3rem;
            text-align: center;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎉 Emoji Picker Test</h1>
        <p style="text-align: center; color: #64748b; margin-bottom: 30px;">
            This is a standalone test of the emoji picker component that will be integrated into the shop item modal.
        </p>
        
        <div class="form-group">
            <label>Select an Emoji for Your Shop Item:</label>
            <div class="emoji-input-wrapper">
                <input 
                    type="text" 
                    id="emojiInput" 
                    value="🎁" 
                    placeholder="Pick an emoji..."
                    maxlength="5"
                />
                <button id="emojiButton" title="Pick an emoji">😀</button>
            </div>
        </div>
        
        <div class="current-emoji" id="currentEmoji">🎁</div>
        
        <div id="emojiPickerContainer" style="position: relative; margin-top: 20px;"></div>
    </div>

    <script type="module">
        import EmojiPicker from 'https://cdn.jsdelivr.net/npm/emoji-picker-react@4.15.1/+esm';
        import { createRoot } from 'https://esm.sh/react-dom@19.1.1/client';
        import React from 'https://esm.sh/react@19.1.1';

        const emojiInput = document.getElementById('emojiInput');
        const emojiButton = document.getElementById('emojiButton');
        const currentEmoji = document.getElementById('currentEmoji');
        const emojiPickerContainer = document.getElementById('emojiPickerContainer');

        let pickerVisible = false;
        let pickerRoot = null;

        function updateEmoji(emoji) {
            emojiInput.value = emoji;
            currentEmoji.textContent = emoji;
        }

        function showEmojiPicker() {
            if (pickerVisible) {
                emojiPickerContainer.innerHTML = '';
                pickerVisible = false;
                return;
            }

            const div = document.createElement('div');
            div.style.cssText = `
                position: absolute;
                right: 0;
                top: 0;
                z-index: 1000;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
                border-radius: 12px;
                overflow: hidden;
            `;
            emojiPickerContainer.innerHTML = '';
            emojiPickerContainer.appendChild(div);

            const root = createRoot(div);
            root.render(
                React.createElement(EmojiPicker, {
                    onEmojiClick: (emojiData) => {
                        updateEmoji(emojiData.emoji);
                        emojiPickerContainer.innerHTML = '';
                        pickerVisible = false;
                    },
                    searchPlaceHolder: "Search emoji...",
                    width: 350,
                    height: 450
                })
            );
            
            pickerVisible = true;
        }

        emojiButton.addEventListener('click', showEmojiPicker);
        emojiInput.addEventListener('input', (e) => {
            currentEmoji.textContent = e.target.value || '🎁';
        });
    </script>
</body>
</html>
